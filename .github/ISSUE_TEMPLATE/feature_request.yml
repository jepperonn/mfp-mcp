name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Claude to be able to do?
      description: Describe the situation and what you'd like to happen. An example conversation helps.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else? (optional)
