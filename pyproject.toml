[project]
name = "mfp-mcp"
version = "0.1.0"
description = "A self-hosted MyFitnessPal MCP server for Claude, with persistent login and a 'My Foods' library"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "cryptography>=42",
    "lxml>=5",
    "uvicorn>=0.30",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
mfp-mcp = "mfp_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mfp_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF003"]  # Danish letters in strings/comments are intended

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF059"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
